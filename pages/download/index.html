<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>下载记录</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../settings/settings.css" />
    <link rel="stylesheet" href="../../ext/icons/iconfont.css" />
    <style>
      #download-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 1rem;
      }
      .download-header-main h3 {
        margin-bottom: 0.25rem;
      }
      .download-header-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .download-search-wrapper {
        position: relative;
        min-width: 220px;
      }
      .download-search-wrapper input {
        width: 100%;
        padding: 0.4em 0.7em 0.4em 2rem;
        border-radius: 999px;
        border: 1px solid var(--border-color);
        background: rgba(0, 0, 0, 0.02);
        color: var(--text-color);
        font-size: 0.9em;
      }
      .download-search-wrapper input:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 2px rgba(var(--accent-color-rgb, 0, 122, 255), 0.2);
      }
      .download-search-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1rem;
        opacity: 0.7;
      }
      body.dark-mode .download-search-wrapper input {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.16);
        color: #f9fafb;
      }
      #download-list {
        max-height: calc(100vh - 220px);
        overflow-y: auto;
        padding-right: 4px;
      }
      .download-row {
        display: flex;
        align-items: center;
        padding: 0.5rem 0.75rem;
        border-radius: 10px;
        cursor: default;
        transition: background 0.15s ease;
      }
      .download-row:hover {
        background: rgba(15, 23, 42, 0.04);
      }
      body.dark-mode .download-row:hover {
        background: rgba(148, 163, 184, 0.18);
      }
      .download-item-checkbox {
        width: 16px;
        height: 16px;
        margin-right: 8px;
        flex: 0 0 auto;
      }
      .settings-list-item-main {
        flex: 1;
        min-width: 0;
      }
      .settings-list-item-title {
        font-size: 0.95rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .settings-list-item-description {
        font-size: 0.8rem;
        opacity: 0.75;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .settings-list-item-actions {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        margin-left: 0.75rem;
      }
      .download-empty {
        padding: 1.5rem 0.5rem;
        text-align: center;
        opacity: 0.8;
        font-size: 0.9rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
      }
      .download-empty-icon {
        font-size: 2rem;
        margin-bottom: 0.35rem;
      }
      .download-empty-title {
        font-weight: 500;
      }
      .download-empty-description {
        opacity: 0.8;
      }
      .download-selection-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0.75rem;
        margin-bottom: 0.75rem;
        border-radius: 8px;
        background: rgba(59, 130, 246, 0.08);
        font-size: 0.85rem;
      }
      body.dark-mode .download-selection-banner {
        background: rgba(37, 99, 235, 0.3);
      }
      .download-selection-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      @media all and (max-width: 800px) {
        #download-list {
          max-height: none;
        }
        .download-header-actions {
          width: 100%;
          margin-top: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="short-hero blue-gradient-background">
      <div class="container">
        <h2>下载记录</h2>
        <div class="settings-info-subheading">
          浏览、搜索和管理你的下载任务。
        </div>
      </div>
    </div>
    <div id="settings-layout">
      <nav id="settings-sidebar" aria-label="Download filters">
        <div class="settings-sidebar-group">
          <div class="settings-sidebar-title">状态</div>
          <button
            type="button"
            class="settings-sidebar-item is-active"
            data-status="all"
          >
            <span class="settings-sidebar-icon i carbon:list"></span>
            <span class="settings-sidebar-label">全部</span>
          </button>
          <button
            type="button"
            class="settings-sidebar-item"
            data-status="completed"
          >
            <span
              class="settings-sidebar-icon i carbon:checkmark-outline"
            ></span>
            <span class="settings-sidebar-label">已完成</span>
          </button>
          <button
            type="button"
            class="settings-sidebar-item"
            data-status="progressing"
          >
            <span class="settings-sidebar-icon i carbon:progress-bar"></span>
            <span class="settings-sidebar-label">进行中</span>
          </button>
          <button
            type="button"
            class="settings-sidebar-item"
            data-status="interrupted"
          >
            <span class="settings-sidebar-icon i carbon:warning-alt"></span>
            <span class="settings-sidebar-label">已失败</span>
          </button>
        </div>
      </nav>
      <div id="settings-main">
        <div class="settings-container">
          <div id="download-header">
            <div class="download-header-main">
              <h3>下载记录</h3>
              <div class="settings-info-subheading">
                快速浏览和管理当前会话中的下载任务。
              </div>
            </div>
            <div class="download-header-actions">
              <div class="download-search-wrapper">
                <span class="download-search-icon i carbon:search"></span>
                <input
                  id="download-search-input"
                  type="search"
                  placeholder="按名称搜索下载"
                  autocomplete="off"
                />
              </div>
              <button
                id="clear-download-history"
                class="settings-primary-button"
              >
                清除所有记录
              </button>
            </div>
          </div>
          <div
            id="download-selection-banner"
            class="download-selection-banner"
            hidden
          >
            <div id="download-selection-text">已选择 0 项</div>
            <div class="download-selection-actions">
              <button
                id="download-selection-delete"
                class="settings-primary-button"
              >
                删除所选
              </button>
              <button id="download-selection-cancel" class="secondary-button">
                取消
              </button>
            </div>
          </div>
          <div id="download-empty" class="download-empty">
            <div class="download-empty-icon i carbon:download"></div>
            <div class="download-empty-title">暂无下载记录</div>
            <div class="download-empty-description">
              在浏览器中开始下载文件后，这里会显示记录。
            </div>
          </div>
          <div id="download-list" class="has-thin-scrollbar"></div>
        </div>
      </div>
    </div>
    <script src="../../js/util/settings/settingsContent.js"></script>
    <script src="../../js/util/theme.js"></script>
    <script src="../../dist/localization.build.js"></script>
    <script>
      (function () {
        var allItems = [];
        var filteredStatus = 'all';
        var searchText = '';
        var selectedPaths = new Set();

        function getStatusText(status) {
          if (status === 'completed') {
            return '已完成';
          }
          if (status === 'interrupted') {
            return '已失败';
          }
          return '进行中';
        }

        function getFileSizeString(bytes) {
          if (!bytes || bytes <= 0) {
            return '';
          }
          var prefixes = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
          var size = bytes;
          var index = 0;
          while (size > 900 && index < prefixes.length - 1) {
            size = size / 1024;
            index++;
          }
          return Math.round(size * 10) / 10 + ' ' + prefixes[index];
        }

        function formatTime(timestamp) {
          var d = new Date(timestamp);
          var h = d.getHours();
          var m = d.getMinutes();
          if (h < 10) h = '0' + h;
          if (m < 10) m = '0' + m;
          return h + ':' + m;
        }

        function renderList() {
          var listEl = document.getElementById('download-list');
          var emptyEl = document.getElementById('download-empty');
          listEl.innerHTML = '';

          var items = allItems.slice().sort(function (a, b) {
            return b.timestamp - a.timestamp;
          });

          if (filteredStatus !== 'all') {
            items = items.filter(function (item) {
              return item.status === filteredStatus;
            });
          }

          if (searchText) {
            var lower = searchText.toLowerCase();
            items = items.filter(function (item) {
              var name = item.name || item.path || '';
              return name.toLowerCase().indexOf(lower) !== -1;
            });
          }

          if (!items.length) {
            emptyEl.style.display = 'flex';
            updateSelectionBanner();
            return;
          }

          emptyEl.style.display = 'none';

          var visiblePaths = new Set();

          items.forEach(function (item) {
            var row = document.createElement('div');
            row.className = 'settings-list-item download-row';
            row.dataset.path = item.path || '';
            if (item.path && selectedPaths.has(item.path)) {
              row.classList.add('is-selected');
            }

            if (item.path) {
              visiblePaths.add(item.path);
            }

            var checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'download-item-checkbox';
            checkbox.checked = item.path ? selectedPaths.has(item.path) : false;

            var main = document.createElement('div');
            main.className = 'settings-list-item-main';
            row.appendChild(checkbox);
            row.appendChild(main);

            var title = document.createElement('div');
            title.className = 'settings-list-item-title';
            title.textContent = item.name || item.path || '';
            main.appendChild(title);

            var desc = document.createElement('div');
            desc.className = 'settings-list-item-description';
            var infoParts = [];
            if (item.size && item.size.total) {
              infoParts.push(getFileSizeString(item.size.total));
            }
            if (item.timestamp) {
              infoParts.push(formatTime(item.timestamp));
            }
            infoParts.push(getStatusText(item.status));
            desc.textContent = infoParts.join(' • ');
            main.appendChild(desc);

            var actions = document.createElement('div');
            actions.className = 'settings-list-item-actions';
            row.appendChild(actions);

            var openBtn = document.createElement('button');
            openBtn.className = 'settings-button';
            openBtn.textContent = '在文件夹中显示';
            openBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              if (item.path) {
                window.postMessage(
                  {
                    message: 'showItemInFolder',
                    path: item.path,
                  },
                  window.location.toString()
                );
              }
            });
            actions.appendChild(openBtn);

            var deleteBtn = document.createElement('button');
            deleteBtn.className = 'settings-icon-button i carbon:trash-can';
            deleteBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              if (item.path) {
                window.postMessage(
                  {
                    message: 'removeDownloadHistoryItem',
                    path: item.path,
                  },
                  window.location.toString()
                );
              }
            });
            actions.appendChild(deleteBtn);

            checkbox.addEventListener('click', function (e) {
              e.stopPropagation();
              var path = row.dataset.path;
              if (!path) {
                return;
              }
              if (checkbox.checked) {
                selectedPaths.add(path);
                row.classList.add('is-selected');
              } else {
                selectedPaths.delete(path);
                row.classList.remove('is-selected');
              }
              updateSelectionBanner();
            });

            row.addEventListener('click', function () {
              var path = row.dataset.path;
              if (!path) {
                return;
              }
              window.postMessage(
                {
                  message: 'showItemInFolder',
                  path: path,
                },
                window.location.toString()
              );
            });

            listEl.appendChild(row);
          });

          selectedPaths.forEach(function (p) {
            if (!visiblePaths.has(p)) {
              selectedPaths.delete(p);
            }
          });
          updateSelectionBanner();
        }

        function updateSelectionBanner() {
          var banner = document.getElementById('download-selection-banner');
          var textEl = document.getElementById('download-selection-text');
          if (!banner || !textEl) {
            return;
          }
          var count = selectedPaths.size;
          if (count === 0) {
            banner.hidden = true;
            return;
          }
          banner.hidden = false;
          textEl.textContent = '已选择 ' + count + ' 项';
        }

        function requestHistory() {
          window.postMessage(
            {
              message: 'getDownloadHistory',
            },
            window.location.toString()
          );
        }

        function bindControls() {
          var sidebarButtons = document.querySelectorAll(
            '#settings-sidebar .settings-sidebar-item'
          );
          sidebarButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
              sidebarButtons.forEach(function (b) {
                b.classList.remove('is-active');
              });
              btn.classList.add('is-active');
              filteredStatus = btn.getAttribute('data-status') || 'all';
              renderList();
            });
          });
          if (sidebarButtons[0]) {
            sidebarButtons[0].classList.add('is-active');
          }

          var searchInput = document.getElementById('download-search-input');
          searchInput.addEventListener('input', function () {
            searchText = searchInput.value || '';
            renderList();
          });

          var clearButton = document.getElementById('clear-download-history');
          clearButton.addEventListener('click', function () {
            window.postMessage(
              {
                message: 'clearDownloadHistory',
              },
              window.location.toString()
            );
          });
        }

        function bindSelectionActions() {
          var cancelButton = document.getElementById(
            'download-selection-cancel'
          );
          var deleteButton = document.getElementById(
            'download-selection-delete'
          );
          if (cancelButton) {
            cancelButton.addEventListener('click', function () {
              selectedPaths.clear();
              renderList();
            });
          }
          if (deleteButton) {
            deleteButton.addEventListener('click', function () {
              if (selectedPaths.size === 0) {
                return;
              }
              var paths = Array.from(selectedPaths);
              selectedPaths.clear();
              paths.forEach(function (p) {
                window.postMessage(
                  {
                    message: 'removeDownloadHistoryItem',
                    path: p,
                  },
                  window.location.toString()
                );
              });
            });
          }
        }

        window.addEventListener('message', function (e) {
          if (!e.origin.startsWith('min://')) {
            return;
          }
          if (e.data && e.data.message === 'receiveDownloadHistory') {
            if (Array.isArray(e.data.items)) {
              allItems = e.data.items;
            } else {
              allItems = [];
            }
            renderList();
          }
          if (e.data && e.data.message === 'downloadHistoryCleared') {
            allItems = [];
            selectedPaths.clear();
            renderList();
          }
          if (e.data && e.data.message === 'downloadHistoryItemRemoved') {
            var path = e.data.path;
            if (path) {
              allItems = allItems.filter(function (item) {
                return item.path !== path;
              });
              renderList();
            }
          }
        });

        bindControls();
        bindSelectionActions();
        requestHistory();
      })();
    </script>
  </body>
</html>
