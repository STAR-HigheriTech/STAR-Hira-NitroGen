<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div class="app">
      <nav class="sidebar">
        <div class="sidebar-title">
          设置<button id="changed-badge" class="changed-badge" type="button" aria-label="定位到已修改的设置" hidden></button>
        </div>
        <div id="nav"></div>
      </nav>
      <div class="main">
        <header class="topbar">
          <div class="topbar-head">
            <h1 id="page-title">常规</h1>
            <div id="subtabs" class="subtabs" role="tablist" hidden></div>
          </div>
          <div class="searchbox">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
            <input
              id="q"
              type="text"
              placeholder="搜索设置项"
              title="搜索设置项（/）"
              aria-label="搜索设置项"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
        </header>
        <div class="restart-banner" id="restart-banner" role="status" hidden></div>
        <div class="content">
          <div class="content-inner" id="content"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./settings.js"></script>
  </body>
</html>
