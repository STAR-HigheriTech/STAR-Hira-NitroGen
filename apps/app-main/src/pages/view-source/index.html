<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>查看源代码</title>
    <link rel="stylesheet" href="hira://shared/base.css" />
    <link rel="stylesheet" href="./view-source.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="page-heading">
        <h1>查看源代码</h1>
        <p class="page-sub" id="source-url">正在读取…</p>
      </div>
      <div class="toolbar">
        <span class="copy-state" id="copy-state"></span>
        <button class="btn" id="refresh">刷新</button>
        <button class="btn" id="copy">复制</button>
      </div>
    </header>
    <div class="source-wrap">
      <pre
        class="source"
        id="source"
        contenteditable="plaintext-only"
        spellcheck="false"
        role="textbox"
        aria-readonly="true"
        aria-label="页面源代码"
      ></pre>
    </div>
    <script type="module" src="./view-source.js"></script>
  </body>
</html>
