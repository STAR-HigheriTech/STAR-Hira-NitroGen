<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>取色器</title>
    <link rel="stylesheet" href="hira://shared/base.css" />
    <link rel="stylesheet" href="./color-picker.css" />
  </head>
  <body>
    <main class="picker">
      <header class="page-header">
        <div class="page-heading">
          <h1>取色器</h1>
        </div>
      </header>

      <section class="card picker-main">
        <div class="picker-top">
          <input
            type="color"
            id="native"
            class="picker-native"
            value="#2563eb"
            aria-label="选择颜色"
          />
          <div class="picker-values">
            <label class="field">
              <span class="field-label">十六进制</span>
              <input
                type="text"
                id="hex"
                class="picker-input"
                spellcheck="false"
                autocomplete="off"
              />
            </label>
            <div class="field">
              <span class="field-label">RGB</span>
              <output class="picker-rgb" id="rgb"></output>
            </div>
          </div>
        </div>
        <div class="picker-actions">
          <button class="btn" id="copy-hex" type="button">复制 HEX</button>
          <button class="btn" id="copy-rgb" type="button">复制 RGB</button>
          <button class="btn" id="eyedropper" type="button" hidden>
            屏幕取色
          </button>
        </div>
        <p class="picker-status" id="status"></p>
      </section>

      <section class="section">
        <h2 class="section-title">最近使用</h2>
        <div class="picker-swatches" id="recent"></div>
      </section>
    </main>
    <script type="module" src="./color-picker.js"></script>
  </body>
</html>
