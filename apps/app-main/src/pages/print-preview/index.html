<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>打印预览</title>
    <link rel="stylesheet" href="hira://shared/base.css" />
    <link rel="stylesheet" href="./print-preview.css" />
  </head>
  <body>
    <header id="topbar">
      <span id="doc-title">打印预览</span>
      <span class="divider"></span>
      <div class="group">
        <button id="prev" class="icon-btn" title="上一页" disabled>‹</button>
        <input id="page" type="number" min="1" value="1" disabled />
        <span id="total">/ ?</span>
        <button id="next" class="icon-btn" title="下一页" disabled>›</button>
      </div>
      <span class="spacer"></span>
      <div class="group">
        <button id="zoomout" class="icon-btn" title="缩小" disabled>−</button>
        <span id="zoom">100%</span>
        <button id="zoomin" class="icon-btn" title="放大" disabled>+</button>
        <button id="fit" class="btn btn-sm" title="适应宽度" disabled>适应</button>
      </div>
    </header>

    <main id="body">
      <div id="viewer"></div>
      <aside id="settings">
        <h2>打印设置</h2>

        <label class="field">
          <span>纸张大小</span>
          <select id="opt-page-size"></select>
        </label>

        <label class="field">
          <span>方向</span>
          <select id="opt-landscape">
            <option value="portrait">纵向</option>
            <option value="landscape">横向</option>
          </select>
        </label>

        <label class="field">
          <span>边距</span>
          <select id="opt-margins"></select>
        </label>

        <label class="field">
          <span>缩放 <b id="opt-scale-value">100%</b></span>
          <input id="opt-scale" type="range" min="50" max="200" step="5" value="100" />
        </label>

        <label class="check">
          <input id="opt-background" type="checkbox" checked />
          <span>打印背景图形</span>
        </label>
      </aside>
    </main>

    <footer id="bottombar">
      <span id="status"></span>
      <span class="spacer"></span>
      <button id="cancel" class="btn">取消</button>
      <button id="save" class="btn">另存为 PDF</button>
      <button id="print" class="btn btn-primary">打印</button>
    </footer>

    <script type="module" src="./print-preview.js"></script>
  </body>
</html>
