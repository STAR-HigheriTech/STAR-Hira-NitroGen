<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="hira://shared/base.css" />

    <div id="shared-state" class="ai-shared" hidden></div>

    <main id="pane" class="ai-pane"></main>

    <script type="module" src="./aisettings.js"></script>
