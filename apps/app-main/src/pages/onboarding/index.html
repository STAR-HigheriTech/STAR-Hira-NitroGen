<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>欢迎使用 Hira</title>
    <link rel="stylesheet" href="hira://shared/base.css" />
    <link rel="stylesheet" href="hira://shared/browser-import.css" />
    <link rel="stylesheet" href="./onboarding.css" />
  </head>
  <body class="oobe-body">
    <div class="oobe-backdrop" aria-hidden="true">
      <div class="oobe-background" id="oobe-theme-background"></div>
      <div class="oobe-background-overlay" id="oobe-theme-background-overlay"></div>
    </div>
    <div class="oobe" aria-busy="true">
      <div class="oobe-drag" aria-hidden="true"></div>
      <button class="icon-btn oobe-close" id="btn-close" type="button" aria-label="关闭并跳过引导">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
          <path
            d="M3.2 3.2l9.6 9.6M12.8 3.2l-9.6 9.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <header class="oobe-head">
        <div class="oobe-brand">
          <img
            class="oobe-brand-icon"
            src="hira://shared/app-icon.png"
            width="22"
            height="22"
            alt=""
          />
          <span class="oobe-brand-name">Hira</span>
        </div>
        <ol class="oobe-steps" id="steps" aria-label="引导进度"></ol>
      </header>

      <main class="oobe-stage" id="stage" aria-live="polite"></main>

      <footer class="oobe-foot">
        <p class="oobe-hint" id="hint"></p>
        <div class="oobe-actions">
          <button class="btn is-hidden" id="btn-back" type="button" disabled>上一步</button>
          <button class="btn btn-primary" id="btn-next" type="button" disabled>继续</button>
        </div>
      </footer>

      <p class="oobe-toast" id="toast" role="status" aria-live="polite" hidden></p>
    </div>
    <script type="module" src="./onboarding.js"></script>
  </body>
</html>
