<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hira</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* ── 子窗口**不是浏览器 UI**：把"UI 前景"那根线剪断 ──────────────────
         `--hira-text-primary` / `--text-color` 在令牌表里绑的是 colors.chromeFg
         （工具栏 / 标签栏 / rail / 面板的图标与文字）。但它们的名字太通用，任何
         跨场景共用件（主题编辑器、弹窗…）自然会引用 —— 于是"只调浏览器
         UI 前景"会把子窗口的文字一起改掉（用户明确指正过）。

         这里在**子窗口入口**（所有简单子窗口共用本文件）把这三个名字按回内容前景：
         本窗口拿到什么主题，就用主题的内容前景。用 !important 是因为主题令牌是
         由 theme-controller **内联**写在 html/body 上的（内联优先级高于样式表）。
         注意：主题编辑器里那块**预览**会把令牌写在自己的子树根上 —— 那是元素级的
         声明，照样盖得住这里（继承永远输给直接声明），预览仍然显示真实效果。 */
      :root,
      body {
        --hira-text-primary: var(--text, var(--fg, #1a1a1a)) !important;
        --text-color: var(--text, var(--fg, #1a1a1a)) !important;
        --hira-chrome-fg: var(--text, var(--fg, #1a1a1a)) !important;
      }
      body {
        /* 字体栈走唯一令牌（shared-types/theme.mjs#UI_FONT_STACK）；兜底串与它同值。
           子窗口是独立视图，首帧可能还没拿到主题令牌，所以兜底必须写全：
           显式中文 UI 字体 + YaHei UI 在文档版 YaHei 之前，否则小字号中文会回退到
           宋体那一类点阵字形 —— 标题栏就成了"粗点阵宋体"。 */
        font-family: var(
          --hira-font-ui,
          'Segoe UI Variable Text',
          'Segoe UI Variable',
          'Segoe UI',
          'Microsoft YaHei UI',
          'Microsoft YaHei',
          'PingFang SC',
          'Noto Sans SC',
          system-ui,
          -apple-system,
          sans-serif
        );
        background: var(--bg, #ffffff);
        /* 文字走**内容前景**（--text = 主题的内容前景）：拿不到主题令牌的子窗口
           （书签编辑器等只用本文件那套 --fg）自动回落到 --fg。 */
        color: var(--text, var(--fg, #1f2937));
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      body.dark {
        --bg: #1a1a1a;
        --fg: #e5e5e5;
      }
      /* ── 主题窗口材质（亚克力 / Mica）────────────────────────────────────
         只有主进程声明了「跟随主题材质」的窗口（通用面板窗口，见 window-config.js
         的 followThemeMaterial）才带 data-window-material，并由 subwindow/main.js
         写在 html 上。两个条件缺一不可：

           · data-window-material   —— 本窗口的原生面会被主进程应用材质；
           · data-theme-background  —— 当前主题真的开了材质 / 壁纸（玻璃判据的
                                      唯一真源在 theme-controller，别处不重判）。

         这一层铺的是 --hira-panel-bg（染色档），不是全透明：
           · 材质生效时   → 染色叠在 DWM 模糊上 = 主题色的玻璃；
           · 材质不可用   → 主进程已把窗口底色写回主题色（window-material-follow），
                            染色叠上去仍是主题观感，不会露出原生默认白 / 黑。
         不写这条的话 body 那层不透明底色会把系统模糊整个盖死（"有垃圾的不透明
         图层阻碍"），材质等于白开。 */
      html[data-window-material='1'][data-theme-background='1'] body {
        background: var(--hira-panel-bg, var(--bg, #ffffff));
      }
      /* ── 标题栏 ────────────────────────────────────────────────────────
         窗口控制按钮**不再自绘**：改由 subwindow/main.js 用 ui-common 的
         `createWindowControlCluster` 装进来 —— 与主窗口是同一份实现（同一套 12×12
         字形、同一份 CSS、同一处悬停行为）。

         下面三条不是随手写的，是"看起来才一样"的前提（理由见
         ui-common/windowControls.ts 的注释）：主窗口那套按钮的悬停底色是**铺满整行**的，
         只要行里还留着上下 / 右侧内边距，按钮就变成"浮在角落的一块方块" ——
         那正是它和原生标题栏最不像的地方。
           · 行高固定，并用 --ng-navbar-top-row-height 把它交给按钮（行高 = 按钮高）；
           · 右侧不留内边距 → 三颗按钮贴住窗口右上角。 */
      .header {
        -webkit-app-region: drag; /* 无边框窗口可拖动（书签编辑器 frame:false） */
        user-select: none;
        height: 34px;
        --ng-navbar-top-row-height: 34px;
        padding: 0 0 0 14px;
        border-bottom: 1px solid var(--hira-border-subtle, rgba(0, 0, 0, 0.1));
        font-size: 13px;
        /* 标题用常规字重（500）：600 在 Windows 上会触发中文合成加粗，
           配合兜底宋体就成"粗点阵宋体"；中文 UI 字体本身没有 500 档时
           浏览器按规范回落到 400，即正常常规体。 */
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      /* 标题：占满左侧剩余宽度，过长省略 —— 否则长标题会把按钮挤出窗口 */
      .header__title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 标题栏右侧的动作区：整块 no-drag，否则按钮点不动（拖动区会抢走指针）。
         刻意不写 gap —— 间距按变体归一在簇自己的 CSS 里（Windows 变体 gap 为 0，
         三颗连着排才与原生一致）。 */
      .header__actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }
      .placeholder {
        color: var(--hira-text-tertiary, #9ca3af);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span id="title" class="header__title">Hira</span>
      <!-- 窗口控制按钮由 subwindow/main.js 用 ui-common 的 createWindowControlCluster
           装进这里 —— 与主窗口**同一份实现**（同一套 12×12 字形、同一份 CSS、
           同一处悬停行为）。哪些按钮亮由 `window:get-state` 回报的**真实能力**决定
           （小窗预览不可最大化、书签编辑器不可最小化…就只亮该亮的那几颗），
           各窗口原来的显示 / 隐藏规则一字未改。 -->
      <div class="header__actions" id="header-actions"></div>
    </div>
    <div class="content" id="content">
      <p class="placeholder">加载中...</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
