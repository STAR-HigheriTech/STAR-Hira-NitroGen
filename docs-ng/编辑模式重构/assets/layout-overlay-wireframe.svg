<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hira 浏览器界面叠加编辑层</title>
  <desc id="desc">真实浏览器界面保持可见，中央工具条和更多按钮面板浮在界面上方，可拖动按钮以克隆形式覆盖在真实控件位置。</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#182230" flood-opacity=".16"/>
    </filter>
    <style>
      .bg{fill:#eaf0f5}.ink{fill:#17202a}.sub{fill:#667085}.faint{fill:#98a2b3}
      .line{stroke:#d7dee7;stroke-width:1}.strongline{stroke:#c4ceda;stroke-width:1}
      .browser{fill:#fff;stroke:#cad4df}.chrome{fill:#f7f9fb}.content{fill:#f2f5f8}
      .accent{fill:#0f766e}.accentsoft{fill:#e7f5f2}.skeleton{fill:#e8edf2}
      .panel{fill:#fff;stroke:#d7dee7}.chip{fill:#fff;stroke:#cbd4df}
      .zone{fill:none;stroke:#0f766e;stroke-width:1.5;stroke-dasharray:7 6}
      .title{font:700 15px 'Segoe UI',sans-serif}.label{font:600 12px 'Segoe UI',sans-serif}
      .small{font:11px 'Segoe UI',sans-serif}.tiny{font:9px 'Segoe UI',sans-serif}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <!-- real browser behind -->
  <rect x="26" y="28" width="1548" height="944" rx="16" class="browser"/>
  <path d="M26 74h1548" class="line"/>
  <path d="M26 144h1548" class="line"/>
  <rect x="26" y="28" width="1548" height="46" rx="16" fill="#f8fafc"/>
  <rect x="26" y="58" width="1548" height="16" fill="#f8fafc"/>
  <circle cx="54" cy="51" r="5" fill="#c8d1dc"/>
  <circle cx="72" cy="51" r="5" fill="#c8d1dc"/>
  <circle cx="90" cy="51" r="5" fill="#c8d1dc"/>
  <rect x="112" y="39" width="190" height="24" rx="8" class="chip"/>
  <circle cx="126" cy="51" r="5" class="accent"/>
  <text x="140" y="55" class="small sub">研究笔记</text>
  <rect x="314" y="39" width="122" height="24" rx="8" class="chip"/>
  <text x="328" y="55" class="small sub">资料库</text>
  <rect x="446" y="39" width="28" height="24" rx="8" fill="#edf1f5"/>
  <path d="M456 51h9M460.5 46.5v9" stroke="#667085" stroke-width="1.4"/>
  <rect x="870" y="37" width="506" height="28" rx="9" class="chip"/>
  <circle cx="888" cy="51" r="5" class="accent"/>
  <text x="902" y="55" class="small sub">https://example.com/research</text>
  <circle cx="1334" cy="51" r="6" fill="#edf1f5"/>
  <circle cx="1352" cy="51" r="6" fill="#edf1f5"/>
  <circle cx="1370" cy="51" r="6" fill="#edf1f5"/>
  <text x="1465" y="55" text-anchor="end" class="small sub">−　□　×</text>

  <!-- nav row behind -->
  <circle cx="52" cy="108" r="6" class="accentsoft"/>
  <text x="70" y="112" class="small sub">返回</text>
  <text x="115" y="112" class="small sub">前进</text>
  <text x="164" y="112" class="small sub">刷新</text>
  <text x="215" y="112" class="small sub">主页</text>
  <rect x="276" y="96" width="52" height="24" rx="7" class="chip"/>
  <circle cx="302" cy="108" r="5" class="accent"/>
  <rect x="1430" y="96" width="28" height="24" rx="7" class="chip"/>
  <text x="1444" y="112" text-anchor="middle" class="small sub">☰</text>

  <!-- left rail real -->
  <rect x="26" y="145" width="58" height="827" fill="#f8fafc"/>
  <path d="M83.5 145v827" class="line"/>
  <circle cx="55" cy="172" r="9" class="accentsoft"/>
  <circle cx="55" cy="212" r="8" fill="#dce3ea"/>
  <circle cx="55" cy="250" r="8" fill="#dce3ea"/>
  <circle cx="55" cy="288" r="8" fill="#dce3ea"/>
  <circle cx="55" cy="326" r="8" fill="#dce3ea"/>

  <!-- left panel real -->
  <rect x="84" y="145" width="302" height="827" fill="#fbfcfd"/>
  <path d="M385.5 145v827" class="line"/>
  <text x="106" y="176" class="label ink">研究工作区</text>
  <rect x="104" y="192" width="96" height="28" rx="14" class="accentsoft"/>
  <text x="152" y="210" text-anchor="middle" class="small" fill="#0f766e">研究</text>
  <rect x="208" y="192" width="96" height="28" rx="14" class="chip"/>
  <text x="256" y="210" text-anchor="middle" class="small sub">日常</text>
  <rect x="104" y="238" width="250" height="38" rx="9" class="chip"/>
  <text x="123" y="262" class="small sub">集锦</text>
  <rect x="104" y="286" width="250" height="38" rx="9" class="chip"/>
  <text x="123" y="310" class="small sub">历史</text>
  <rect x="104" y="334" width="250" height="38" rx="9" class="chip"/>
  <text x="123" y="358" class="small sub">下载</text>
  <rect x="104" y="382" width="250" height="38" rx="9" class="chip"/>
  <text x="123" y="406" class="small sub">研究面板</text>

  <!-- web content real -->
  <rect x="386" y="145" width="918" height="827" class="content"/>
  <text x="432" y="190" class="title ink">研究内容</text>
  <rect x="432" y="208" width="540" height="12" rx="6" fill="#e2e8ee"/>
  <rect x="432" y="232" width="450" height="12" rx="6" fill="#e8edf2"/>
  <rect x="432" y="278" width="404" height="210" rx="16" fill="#e8edf2"/>
  <rect x="852" y="278" width="404" height="210" rx="16" fill="#edf1f5"/>
  <rect x="432" y="516" width="824" height="270" rx="16" fill="#edf1f5"/>
  <text x="844" y="658" text-anchor="middle" class="label sub">网页保持真实可见</text>

  <!-- right panel real -->
  <rect x="1304" y="145" width="270" height="827" fill="#fbfcfd"/>
  <path d="M1303.5 145v827" class="line"/>
  <text x="1328" y="178" class="label ink">固定面板</text>
  <rect x="1328" y="198" width="218" height="62" rx="10" class="chip"/>
  <rect x="1342" y="212" width="90" height="8" rx="4" class="skeleton"/>
  <rect x="1342" y="232" width="170" height="7" rx="3.5" fill="#eef2f6"/>
  <rect x="1328" y="272" width="218" height="62" rx="10" class="chip"/>
  <rect x="1342" y="286" width="64" height="8" rx="4" class="skeleton"/>
  <rect x="1342" y="306" width="152" height="7" rx="3.5" fill="#eef2f6"/>

  <!-- central toolbar -->
  <rect x="536" y="24" width="528" height="48" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="562" y="53" class="label ink">编辑界面</text>
  <rect x="636" y="34" width="64" height="28" rx="8" class="chip"/>
  <text x="668" y="52" text-anchor="middle" class="small sub">撤销</text>
  <rect x="708" y="34" width="64" height="28" rx="8" class="chip"/>
  <text x="740" y="52" text-anchor="middle" class="small sub">重做</text>
  <rect x="780" y="34" width="158" height="28" rx="8" class="accentsoft" stroke="#add7d1"/>
  <text x="859" y="52" text-anchor="middle" class="small" fill="#0f766e">更多按钮</text>
  <rect x="948" y="34" width="92" height="28" rx="8" class="accent"/>
  <text x="994" y="52" text-anchor="middle" class="small" fill="#fff">完成</text>

  <!-- central more panel -->
  <rect x="490" y="84" width="620" height="472" rx="15" class="panel" filter="url(#shadow)"/>
  <text x="514" y="115" class="label ink">更多按钮</text>
  <text x="1075" y="115" text-anchor="end" class="small sub">×</text>
  <rect x="514" y="132" width="572" height="32" rx="9" fill="#f2f5f8"/>
  <rect x="518" y="136" width="92" height="24" rx="7" fill="#fff" stroke="#d7dee7"/>
  <text x="564" y="153" text-anchor="middle" class="tiny ink">导航栏</text>
  <text x="650" y="153" text-anchor="middle" class="tiny sub">侧栏</text>
  <text x="1035" y="153" text-anchor="end" class="tiny sub">拖动到真实界面</text>

  <text x="514" y="197" class="tiny sub">未使用按钮</text>
  <rect x="514" y="208" width="572" height="70" rx="10" fill="#f7f9fb" stroke="#ced7e1" stroke-dasharray="5 5"/>
  <rect x="534" y="225" width="34" height="34" rx="8" class="chip"/>
  <circle cx="551" cy="242" r="6" fill="#d8e0e8"/>
  <rect x="578" y="225" width="34" height="34" rx="8" class="chip"/>
  <circle cx="595" cy="242" r="6" fill="#d8e0e8"/>
  <rect x="622" y="225" width="34" height="34" rx="8" class="chip"/>
  <circle cx="639" cy="242" r="6" fill="#d8e0e8"/>
  <rect x="666" y="225" width="34" height="34" rx="8" class="chip"/>
  <circle cx="683" cy="242" r="6" fill="#d8e0e8"/>
  <text x="723" y="247" class="small faint">暂无隐藏按钮</text>

  <text x="514" y="316" class="tiny sub">快速布局</text>
  <rect x="514" y="327" width="572" height="58" rx="10" class="chip"/>
  <rect x="528" y="340" width="310" height="30" rx="6" fill="#f4f7fa"/>
  <text x="528" y="375" class="small ink">经典顶栏 · 最适合保留现有习惯</text>
  <rect x="514" y="393" width="278" height="58" rx="10" class="chip"/>
  <rect x="528" y="407" width="34" height="28" rx="6" fill="#e7f5f2"/>
  <rect x="570" y="407" width="202" height="28" rx="6" fill="#f4f7fa"/>
  <text x="528" y="439" class="small ink">侧栏优先</text>
  <rect x="800" y="393" width="286" height="58" rx="10" class="chip"/>
  <rect x="814" y="407" width="258" height="10" rx="5" fill="#e7f5f2"/>
  <rect x="814" y="426" width="258" height="10" rx="5" fill="#f4f7fa"/>
  <text x="814" y="439" class="small ink">极简专注</text>

  <text x="514" y="476" class="tiny sub">构件</text>
  <rect x="514" y="485" width="132" height="34" rx="8" class="chip"/>
  <text x="580" y="507" text-anchor="middle" class="small sub">控件</text>
  <rect x="658" y="485" width="132" height="34" rx="8" class="chip"/>
  <text x="724" y="507" text-anchor="middle" class="small sub">应用</text>
  <rect x="802" y="485" width="132" height="34" rx="8" class="chip"/>
  <text x="868" y="507" text-anchor="middle" class="small sub">面板</text>
  <rect x="946" y="485" width="140" height="34" rx="8" class="chip"/>
  <text x="1016" y="507" text-anchor="middle" class="small sub">栏与列</text>
  <rect x="514" y="529" width="572" height="14" rx="7" fill="#f7f9fb"/>

  <!-- exact zones on real UI -->
  <rect x="36" y="96" width="238" height="40" rx="8" class="zone"/>
  <text x="44" y="91" class="tiny" fill="#0f766e">导航按钮</text>
  <rect x="1404" y="96" width="70" height="40" rx="8" class="zone"/>
  <rect x="38" y="158" width="34" height="222" rx="8" class="zone"/>
  <text x="44" y="154" class="tiny" fill="#0f766e">侧栏常驻区</text>

  <!-- drag ghost -->
  <rect x="242" y="328" width="102" height="38" rx="9" fill="#fff" stroke="#0f766e" filter="url(#shadow)"/>
  <circle cx="262" cy="347" r="8" class="accentsoft"/>
  <text x="278" y="351" class="small ink">历史面板</text>
  <path d="M267 376v32" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M261 383l6 6 6-6" fill="none" stroke="#0f766e" stroke-width="2"/>

  <!-- contextual inspector -->
  <rect x="216" y="424" width="248" height="144" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="236" y="451" class="label ink">历史面板</text>
  <text x="236" y="468" class="tiny sub">侧栏 · 常驻区</text>
  <rect x="236" y="484" width="208" height="28" rx="7" fill="#f6f8fa"/>
  <text x="248" y="503" class="tiny sub">可见</text>
  <text x="430" y="503" text-anchor="end" class="tiny" fill="#0f766e">始终显示</text>
  <rect x="236" y="522" width="100" height="28" rx="7" class="chip"/>
  <text x="286" y="541" text-anchor="middle" class="tiny sub">固定</text>
  <rect x="344" y="522" width="100" height="28" rx="7" class="chip"/>
  <text x="394" y="541" text-anchor="middle" class="tiny sub">移入更多</text>

  <!-- status -->
  <rect x="672" y="940" width="256" height="36" rx="10" class="panel"/>
  <circle cx="692" cy="958" r="5" class="accent"/>
  <text x="706" y="962" class="tiny sub">拖动排序 · 松手保存 · Esc 退出</text>
</svg>
